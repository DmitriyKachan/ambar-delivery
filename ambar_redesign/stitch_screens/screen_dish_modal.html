<!DOCTYPE html>

<html class="dark" lang="uk"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Піца М'ясна Баварія - Деталі</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary-container": "#004966",
                        "surface-glass": "rgba(24, 24, 28, 0.8)",

                        "on-secondary-fixed": "#40000c",
                        "inverse-surface": "#e5e1e4",
                        "on-primary-fixed": "#2a1700",
                        "on-tertiary-fixed-variant": "#004c6a",
                        "primary-fixed": "#ffddb8",
                        "primary": "#ffc174",
                        "surface-container": "#201f21",
                        "surface-card": "#18181c",
                        "on-tertiary-fixed": "#001e2d",
                        "on-tertiary": "#00344a",
                        "secondary-fixed-dim": "#ffb3b6",
                        "on-primary-fixed-variant": "#653e00",
                        "tertiary-container": "#1abdff",
                        "surface": "#131315",
                        "inverse-primary": "#855300",
                        "error-container": "#93000a",
                        "surface-dim": "#131315",
                        "surface-container-highest": "#353437",
                        "on-error": "#690005",
                        "tertiary-fixed": "#c5e7ff",

                        "on-primary": "#472a00",

                        "on-error-container": "#ffdad6",
                        "secondary-fixed": "#ffdada",

                        "on-background": "#e5e1e4",
                        "on-surface": "#e5e1e4",
                        "outline-variant": "#534434",
                        "on-secondary": "#68001a",
                        "text-primary": "#FFFFFF",
                        "on-primary-container": "#613b00",
                        "on-secondary-container": "#ffdcdc",
                        "on-surface-variant": "#d8c3ad",
                        "tertiary-fixed-dim": "#7fd0ff",
                        "primary-fixed-dim": "#ffb95f",
                        "error": "#ffb4ab",
                        "outline": "#a08e7a",
                        "text-muted": "#9ca3af",
                        "surface-container-high": "#2a2a2c",
                        "surface-container-low": "#1b1b1d",
                        "surface-tint": "#ffb95f",
                        "primary-container": "#f59e0b",
                        "secondary-container": "#cc003c",
                        "secondary": "#ffb3b6",
                        "surface-bright": "#39393b"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "container-max": "1280px"
                    },
                    fontFamily: {
                        "headline-md": ["Montserrat"],
                        "display-lg": ["Montserrat"],
                        "price-display": ["Montserrat"],
                        "label-caps": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Montserrat"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "700" }],

                }
            }
        }

<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-40 flex items-center justify-center p-margin-mobile md:p-margin-desktop overflow-y-auto">
<!-- Modal Container -->
<div class="relative w-full max-w-6xl bg-surface-card rounded-xl overflow-hidden shadow-2xl border border-white/5 flex flex-col md:flex-row max-h-[90vh] z-50 animate-[fadeIn_0.3s_ease-out]">
<!-- Close Button (Absolute) -->
<button aria-label="Закрити" class="absolute top-4 right-4 z-50 p-2 rounded-full bg-surface-glass text-text-primary hover:text-primary transition-colors border border-white/10">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Image Section -->
<div class="w-full md:w-1/2 relative bg-surface-container-lowest shrink-0 group overflow-hidden h-64 md:h-auto">
<!-- Using DATA:IMAGE:IMAGE_1 as requested for the pizza image -->
<div aria-label="М'ясна Баварія" class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" role="img" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg');">
</div>
<!-- Vignette Overlay -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-black/20 to-black/80"></div>
<!-- Badge -->
<div class="absolute top-6 left-6 flex gap-2">
<span class="bg-[#e11d48] text-white px-3 py-1 rounded-full font-label-caps text-label-caps tracking-wider shadow-lg">ХІТ ПРОДАЖУ</span>
</div>
</div>
<!-- Content Section -->
<div class="w-full md:w-1/2 flex flex-col h-full max-h-[60vh] md:max-h-full">
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-8 space-y-8">
<!-- Header -->
<div>
<h1 class="font-display-lg-mobile md:font-display-lg text-text-primary mb-2">Піца М'ясна Баварія</h1>
<p class="font-body-md text-text-muted leading-relaxed">
                            мисливські ковбаски, салямі, шинка, бекон, моцарела, фірмовий томатний соус, орегано
                        </p>
</div>
<!-- Size Selector (Segmented Control) -->
<div class="space-y-4">
<h3 class="font-headline-md text-text-primary text-lg">Розмір</h3>
<div class="grid grid-cols-3 gap-2 bg-surface-container p-1 rounded-lg border border-white/5">
<label class="cursor-pointer relative text-center">
<input class="peer sr-only" name="size" type="radio" value="30"/>
<div class="py-3 px-2 rounded-md peer-checked:bg-surface-card peer-checked:border-primary/50 border border-transparent peer-checked:shadow-sm transition-all text-on-surface-variant peer-checked:text-primary">
<div class="font-bold mb-1">30 см</div>
<div class="text-xs opacity-70">450г / 215 ₴</div>
</div>
</label>
<label class="cursor-pointer relative text-center">
<input checked="" class="peer sr-only" name="size" type="radio" value="35"/>
<div class="py-3 px-2 rounded-md peer-checked:bg-surface-card peer-checked:border-primary/50 border border-transparent peer-checked:shadow-sm transition-all text-on-surface-variant peer-checked:text-primary">
<div class="font-bold mb-1">35 см</div>
<div class="text-xs opacity-70">620г / 265 ₴</div>
</div>
</label>
<label class="cursor-pointer relative text-center">
<input class="peer sr-only" name="size" type="radio" value="40"/>
<div class="py-3 px-2 rounded-md peer-checked:bg-surface-card peer-checked:border-primary/50 border border-transparent peer-checked:shadow-sm transition-all text-on-surface-variant peer-checked:text-primary">
<div class="font-bold mb-1">40 см</div>
<div class="text-xs opacity-70">850г / 325 ₴</div>
</div>
</label>
</div>
</div>
<!-- Crust Options -->
<div class="space-y-4">
<h3 class="font-headline-md text-text-primary text-lg">Тісто та бортики</h3>
<div class="space-y-3">
<label class="flex items-center justify-between p-4 rounded-lg bg-surface-container border border-white/5 cursor-pointer hover:border-white/10 transition-colors">
<div class="flex items-center gap-3">
<input checked="" class="w-5 h-5 text-primary bg-surface-card border-white/20 focus:ring-primary focus:ring-offset-surface-card" name="crust" type="radio"/>
<span class="font-body-md text-text-primary">Тонке класичне тісто</span>
</div>
<span class="text-text-muted">+ 0 ₴</span>
</label>
<label class="flex items-center justify-between p-4 rounded-lg bg-surface-container border border-white/5 cursor-pointer hover:border-white/10 transition-colors">
<div class="flex items-center gap-3">
<input class="w-5 h-5 text-primary bg-surface-card border-white/20 focus:ring-primary focus:ring-offset-surface-card" name="crust" type="radio"/>
<span class="font-body-md text-text-primary">Сирний борт</span>
</div>
<span class="text-primary font-bold">+ 45 ₴</span>
</label>
</div>
</div>
<!-- Additional Toppings -->
<div class="space-y-4">
<h3 class="font-headline-md text-text-primary text-lg">Додаткові інгредієнти</h3>
<div class="space-y-3">
<label class="flex items-center justify-between p-4 rounded-lg bg-surface-container border border-white/5 cursor-pointer hover:border-white/10 transition-colors">
<div class="flex items-center gap-3">
<input class="w-5 h-5 rounded text-primary bg-surface-card border-white/20 focus:ring-primary focus:ring-offset-surface-card" type="checkbox"/>
<span class="font-body-md text-text-primary">Подвійний сир моцарела</span>
</div>
<span class="text-text-muted">+ 35 ₴</span>
</label>
<label class="flex items-center justify-between p-4 rounded-lg bg-surface-container border border-white/5 cursor-pointer hover:border-white/10 transition-colors">
<div class="flex items-center gap-3">
<input class="w-5 h-5 rounded text-primary bg-surface-card border-white/20 focus:ring-primary focus:ring-offset-surface-card" type="checkbox"/>
<span class="font-body-md text-text-primary">Гострий перець халапеньйо</span>
</div>
<span class="text-text-muted">+ 25 ₴</span>
</label>
<label class="flex items-center justify-between p-4 rounded-lg bg-surface-container border border-white/5 cursor-pointer hover:border-white/10 transition-colors">
<div class="flex items-center gap-3">
<input class="w-5 h-5 rounded text-primary bg-surface-card border-white/20 focus:ring-primary focus:ring-offset-surface-card" type="checkbox"/>
<span class="font-body-md text-text-primary">Бекон хрусткий</span>
</div>
<span class="text-text-muted">+ 30 ₴</span>
</label>
</div>
</div>
<!-- Free Sauces -->
<div class="space-y-4 pb-8">
<div class="flex items-center justify-between">
<h3 class="font-headline-md text-text-primary text-lg">Безкоштовний соус до бортиків</h3>
<span class="text-xs bg-surface-variant text-text-muted px-2 py-1 rounded">Оберіть один</span>
</div>
<div class="flex flex-wrap gap-2">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="sauce" type="radio"/>
<span class="inline-block px-4 py-2 rounded-full border border-white/10 text-sm font-medium peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-colors text-text-muted hover:border-white/30 bg-surface-container">Фірмовий BBQ</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="sauce" type="radio"/>
<span class="inline-block px-4 py-2 rounded-full border border-white/10 text-sm font-medium peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-colors text-text-muted hover:border-white/30 bg-surface-container">Часниковий</span>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="sauce" type="radio"/>
<span class="inline-block px-4 py-2 rounded-full border border-white/10 text-sm font-medium peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-primary transition-colors text-text-muted hover:border-white/30 bg-surface-container">Гострий чилі</span>
</label>
</div>
</div>
</div>
<!-- Footer (Sticky) -->
<div class="border-t border-white/10 bg-surface-card p-6 flex flex-col sm:flex-row items-center gap-4 shrink-0">
<!-- Quantity -->
<div class="flex items-center bg-surface-container rounded-full border border-white/10 w-full sm:w-auto shrink-0 justify-between">
<button aria-label="Зменшити кількість" class="w-12 h-12 flex items-center justify-center text-text-primary hover:text-primary transition-colors disabled:opacity-50">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-headline-md text-text-primary w-8 text-center text-lg">1</span>
<button aria-label="Збільшити кількість" class="w-12 h-12 flex items-center justify-center text-text-primary hover:text-primary transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<!-- Add to Cart Button -->
<button class="flex-1 w-full bg-primary-container hover:bg-primary-fixed-dim text-black font-headline-md text-base rounded-full py-4 px-6 flex items-center justify-center gap-2 transition-all hover:scale-[1.02] active:scale-95 shadow-[0_0_20px_rgba(245,158,11,0.2)]">
<span>Додати до кошика</span>
<span class="opacity-50 text-xl">•</span>
<span>265 ₴</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
